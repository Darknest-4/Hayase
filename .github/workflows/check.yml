name: Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  server:
    name: Server — typecheck, tests, migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yume
          POSTGRES_PASSWORD: yume
          POSTGRES_DB: yume
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yume"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.6+ is required for --experimental-strip-types
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test
        env:
          JWT_SECRET: ci-secret-not-used-for-anything-real-0123456789

      - name: Apply migrations to a clean database
        run: npm run migrate
        env:
          DATABASE_URL: postgres://yume:yume@localhost:5432/yume

      - name: Migrations are idempotent (re-running is a no-op)
        run: |
          output=$(npm run migrate --silent)
          echo "$output"
          if echo "$output" | grep -q "^applied "; then
            echo "::error::re-running migrations applied something again — they are not idempotent"
            exit 1
          fi
        env:
          DATABASE_URL: postgres://yume:yume@localhost:5432/yume

      # These send real HTTP requests at the assembled application. Without
      # them a commit that left every admin route unauthenticated would still
      # go green, because nothing else in this pipeline exercises a route.
      - name: Integration tests (routes, auth gates, rate limiting)
        run: npm run test:integration
        env:
          DATABASE_URL: postgres://yume:yume@localhost:5432/yume
          JWT_SECRET: ci-secret-not-used-for-anything-real-0123456789

      # The security probes, made permanent. Each one was actually run against
      # a live instance during the audit; the ones that found a defect say so
      # in the test, so a reverted fix reports what it used to allow rather
      # than only that an assertion failed.
      #
      # This needs its own step: the unit-test step above runs before the
      # database exists, so without DATABASE_URL the whole suite skips itself
      # and reports green having checked nothing.
      - name: Adversarial tests (forgery, injection, SSRF, IDOR, races)
        run: npm run test:adversarial
        env:
          DATABASE_URL: postgres://yume:yume@localhost:5432/yume
          JWT_SECRET: ci-secret-not-used-for-anything-real-0123456789

      - name: Worker drains end to end
        run: npm run worker:once
        env:
          DATABASE_URL: postgres://yume:yume@localhost:5432/yume
          JWT_SECRET: ci-secret-not-used-for-anything-real-0123456789

      - name: Build
        run: npm run build

  web:
    name: Web client — syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # the client ships as plain scripts with no build step, so a parse check
      # is what protects it
      - name: Syntax-check every client script
        run: |
          shopt -s globstar
          for file in web/**/*.js; do
            case "$file" in web/js/vendor/*) continue ;; esac   # third-party, not ours
            node --check "$file" || exit 1
          done
          echo "checked $(ls web/**/*.js | wc -l) files"

      # The client ships as plain scripts with no build step, so style drift is
      # only ever caught here. Vendored third-party code is excluded via
      # --ignore: standard has no support for a negated glob argument, and
      # passing one made ESLint fail with "No files matching" — so this step
      # was erroring out rather than linting anything.
      - name: Lint the client
        run: npx --yes standard --ignore "web/js/vendor/**" "web/**/*.js" "web/test/*.mjs"

      # The engine is the one piece of client code with real logic in it —
      # everything else is rendering. It loads against a small DOM stub, so it
      # needs no browser and no server.
      # --experimental-strip-types so a client test may import the server's own
      # TypeScript when it needs to check against the real rule rather than a
      # copy of it.
      - name: Client tests
        run: node --experimental-strip-types --test web/test/*.test.mjs

  # Nothing in this pipeline ever built the container, so a Dockerfile that
  # could not parse went through review, through CI and through a merge — the
  # deployment was the first thing to find out. A build is the cheapest check
  # there is for the one artefact production actually runs.
  #
  # `docker build` only, not a push: this proves the image assembles. What it
  # does at runtime is the business of the jobs above, which run the same code
  # directly.
  image:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build --tag yume:ci .

      # A syntactically valid Dockerfile that produces an image which exits on
      # start is still broken. This asks the entrypoint's interpreter to parse
      # the command without a database behind it, which is enough to catch a
      # mangled CMD.
      - name: The entrypoint is runnable
        run: docker run --rm --entrypoint sh yume:ci -c 'node --experimental-strip-types --check src/index.ts && echo entrypoint ok'

      # The client is served from inside the image, so a COPY that stopped
      # copying it is a blank site rather than a failed build.
      - name: The image carries the web client and the migrations
        run: |
          docker run --rm --entrypoint sh yume:ci -c 'test -f /app/web/index.html' \
            || { echo '::error::/app/web/index.html is missing from the image'; exit 1; }
          docker run --rm --entrypoint sh yume:ci -c 'ls /app/db/migrations/*.sql >/dev/null' \
            || { echo '::error::/app/db/migrations is missing from the image'; exit 1; }

  # The client's unit tests run against a DOM stub, which left the router, the
  # layout, the sign-in modal and the player with no automated coverage at all:
  # a change that threw on boot passed every test in the repository. This job
  # drives the assembled application in a real browser.
  #
  # Playwright is installed here rather than added to package.json: nothing
  # the application ships needs it, and a dependency that only CI uses is a
  # dependency the deployment still has to carry.
  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yume
          POSTGRES_PASSWORD: yume
          POSTGRES_DB: yume
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yume"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install Playwright
        # At the repository root: the test lives under web/, so this is where
        # its import resolves from.
        run: |
          npm install --no-save playwright@1.56
          npx playwright install --with-deps chromium

      - name: Apply migrations
        run: npm run migrate
        working-directory: server
        env:
          DATABASE_URL: postgres://yume:yume@localhost:5432/yume

      - name: Browser smoke test
        run: npm run test:e2e
        working-directory: server
        env:
          DATABASE_URL: postgres://yume:yume@localhost:5432/yume
          JWT_SECRET: ci-secret-not-used-for-anything-real-0123456789
          LOG_LEVEL: warn
