<!doctype html>
<!-- lang is replaced at boot by I18n.setLanguage() from the viewer's
     preference; "hu" is the starting value because this is a Hungarian site. -->
<html lang="hu">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yume</title>
  <meta name="description" content="Yume — anime tracking and discovery." />
  <link rel="preconnect" href="https://graphql.anilist.co/">
  <link rel="preconnect" href="https://api.jikan.moe/">
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
  <link rel="icon" href="assets/yume.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- ambient banner behind everything -->
  <div id="global-banner" class="global-banner"></div>

  <div class="app-shell">
    <!-- ===== Sidebar ===== -->
    <nav class="sidebar" id="sidebar">
      <a class="sidebar-logo" href="#/home" title="Yume">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M23.5 4.5A13 13 0 1 0 27.5 21 10.5 10.5 0 0 1 23.5 4.5Z" fill="currentColor"/>
          <circle cx="23" cy="9" r="1.6" fill="var(--accent)"/>
          <circle cx="27" cy="14" r="1" fill="var(--accent)"/>
        </svg>
        <span class="sidebar-logo-text">yume</span>
      </a>

      <a class="sidebar-btn nav-primary" href="#/home" data-route="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </a>
      <a class="sidebar-btn" href="#/dashboard" data-route="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Dashboard</span>
      </a>
      <a class="sidebar-btn nav-primary" href="#/search" data-route="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Search</span>
      </a>
      <a class="sidebar-btn" href="#/schedule" data-route="schedule">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
        <span>Schedule</span>
      </a>
      <a class="sidebar-btn" href="#/w2g" data-route="w2g">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Watch Together</span>
      </a>
      <a class="sidebar-btn" href="#/community" data-route="community">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4c0-1.1.9-2 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/></svg>
        <span>Community</span>
      </a>
      <a class="sidebar-btn nav-primary" href="#/list" data-route="list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span>Library</span>
      </a>
      <a class="sidebar-btn nav-primary" href="#/notifications" data-route="notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span>Notifications</span>
        <span class="notif-badge hidden" id="notif-badge"></span>
      </a>
      <a class="sidebar-btn" href="#/extensions" data-route="extensions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M17.5 13v8M13.5 17h8"/></svg>
        <span>Extensions</span>
      </a>
      <button class="sidebar-btn sidebar-profile" id="profile-switcher" title="Profile">
        <span class="sidebar-avatar" id="sidebar-avatar">🦊</span>
      </button>

      <a class="sidebar-btn hidden" href="#/admin" data-route="admin" id="nav-admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>
        <span>Admin</span>
      </a>

      <div class="sidebar-spacer"></div>

      <a class="sidebar-btn" href="#/settings" data-route="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Settings</span>
      </a>

      <!-- mobile-only: opens the More bottom sheet -->
      <button class="sidebar-btn nav-more" id="nav-more" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        <span>More</span>
      </button>
    </nav>

    <!-- ===== Main content ===== -->
    <main class="page" id="page"></main>
  </div>

  <!-- quick search modal (Ctrl+K / S) -->
  <div class="modal-backdrop hidden" id="search-modal">
    <div class="search-modal">
      <div class="search-modal-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search-modal-input" type="text" placeholder="Search anime..." autocomplete="off" spellcheck="false">
        <kbd>ESC</kbd>
      </div>
      <div class="search-modal-results" id="search-modal-results"></div>
    </div>
  </div>

  <!-- toast container -->
  <div class="toasts" id="toasts"></div>

  <script src="copy.js"></script>
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <!-- Preferences and translation load before every page module: the pages
       call T() while rendering, and hu.js registers itself into I18n at
       load time, so the order here is load-bearing. -->
  <script src="js/prefs.js"></script>
  <script src="js/i18n.js"></script>
  <script src="i18n/hu.js"></script>
  <script src="js/api.js"></script>
  <script src="js/yume-api.js"></script>
  <!-- the catalogue resolver: decides whether our database or an external
       provider answers a request for an anime. Needs both API and YumeAPI. -->
  <script src="js/catalogue.js"></script>
  <script src="js/library-sync.js"></script>
  <script src="js/extension-host.js"></script>
  <script src="js/stream-engine.js"></script>
  <script src="js/watch-time.js"></script>
  <!-- HLS support. The player itself (js/vendor/hls.min.mjs) is fetched only
       when an HLS stream is actually encountered, so this costs nothing on a
       page that never plays one. -->
  <script src="js/hls-handler.js"></script>
  <script src="js/components.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/search.js"></script>
  <script src="js/pages/anime.js"></script>
  <script src="js/pages/schedule.js"></script>
  <script src="js/pages/list.js"></script>
  <script src="js/pages/watch.js"></script>
  <script src="js/pages/community.js"></script>
  <script src="js/pages/w2g.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/profiles.js"></script>
  <script src="js/pages/history.js"></script>
  <script src="js/pages/analytics.js"></script>
  <script src="js/pages/achievements.js"></script>
  <script src="js/pages/notifications.js"></script>
  <script src="js/pages/themes.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/extensions.js"></script>
  <script src="js/pages/developer.js"></script>
  <script src="js/pages/admin.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/onboarding.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
