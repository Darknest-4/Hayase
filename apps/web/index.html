<!doctype html>
<!-- lang is replaced at boot by I18n.setLanguage() from the viewer's
     preference; "hu" is the starting value because this is a Hungarian site. -->
<html lang="hu">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- The per-page <head>. Everything between these two markers is replaced
       by apps/api/src/modules/seo/routes.ts when a crawlable path is requested (today
       /anime/:id); what is written here is what an ordinary page gets, and
       what is served if the SEO route is not running at all. Do not remove
       the markers — without them the replacement silently does nothing. -->
  <!--yume:seo-->
  <title>Yume</title>
  <meta name="description" content="Yume — anime követés, felfedezés és nézés, egy helyen." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Yume" />
  <meta property="og:title" content="Yume" />
  <meta property="og:description" content="Yume — anime követés, felfedezés és nézés, egy helyen." />
  <meta name="twitter:card" content="summary" />
  <!--/yume:seo-->
  <meta name="theme-color" content="#08080b" />
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" href="/assets/yume.svg" />
  <!-- Only the font host is preconnected. AniList, Jikan and YouTube used to
       be too, on every page: three TLS handshakes for origins a page with a
       working catalogue never contacts. -->
  <link rel="dns-prefetch" href="https://graphql.anilist.co/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- One variable file, upright only: the interface has no italic type, and
       the italic axis doubled what every first visit downloaded. -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <!-- Order is the contract: tokens hold the values, components.css holds the
       base and the primitives, style.css holds the shell and the screens. A
       page rule and a primitive rule of equal specificity are settled by file
       order, so a screen can override a primitive without !important.

       These three are all a page needs. The player's sheet (player2.css), the
       maintenance screen's (maintenance.css) and the admin panel's
       (admin.css) are loaded by the module that draws them — see
       shared/lib/stylesheet.js — so a visitor who never opens the admin panel
       never downloads its two thousand lines. -->
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/style.css">
</head>

<!--
  `booting`: amíg a router el nem dönti, MELYIK keret jár ehhez a címhez,
  az alkalmazás krómja nem látszik.

  Enélkül a statikus váz ikonsávja végigvillan a kezdőképernyő és a belépőlap
  előtt: a HTML azonnal fest, a döntés viszont csak a modulgráf betöltése után
  születik meg. A címet ide beágyazott szkripttel lehetne beolvasni, de a
  `script-src 'self'` azt megfogja — és egy hibaoldalon tanultuk meg, hogy
  ilyenkor nincs hibaüzenet, csak néma hiány.

  A jelölést az `App.applyLayout()` veszi le, még a hálózat előtt.
-->
<body class="booting">
  <!-- Keyboard users land here first: the navigation is a dozen links before
       any content, and without this every page starts by tabbing through it. -->
  <a class="skip-link" href="#page">Ugrás a tartalomra</a>
  <!-- ambient banner behind the top of the page -->
  <div id="global-banner" class="global-banner" aria-hidden="true"></div>
  <div class="app-shell">
    <!-- ===== Navigation =====
         One element, three shapes (style.css, "shell"): a labelled sidebar
         from 1280px, an icon rail from 768px, and below that a floating tab
         bar holding only the `.nav-primary` items plus "More". The labels
         here are the Hungarian defaults; router.applyNavLabels() rewrites
         them in the viewer's language before the chrome is shown. -->
    <nav class="sidebar" id="sidebar" aria-label="Fő navigáció">
      <a class="sidebar-logo" href="#/home" aria-label="Főoldal">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M23.5 4.5A13 13 0 1 0 27.5 21 10.5 10.5 0 0 1 23.5 4.5Z" fill="currentColor"/>
          <circle cx="23" cy="9" r="1.6" fill="var(--accent)"/>
          <circle cx="27" cy="14" r="1" fill="var(--accent)"/>
        </svg>
        <span class="sidebar-logo-text">yume</span>
      </a>
      <button class="sidebar-search" id="sidebar-search" type="button" aria-keyshortcuts="Control+K">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span class="sidebar-search-label">Gyorskeresés</span>
        <kbd>Ctrl K</kbd>
      </button>
      <span class="sidebar-group-label" data-label="nav.group.discover">Felfedezés</span>
      <a class="sidebar-btn nav-primary" href="#/home" data-route="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Főoldal</span>
      </a>
      <a class="sidebar-btn nav-primary" href="#/search" data-route="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Keresés</span>
      </a>
      <a class="sidebar-btn" href="#/schedule" data-route="schedule">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
        <span>Menetrend</span>
      </a>
      <a class="sidebar-btn" href="#/dashboard" data-route="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Áttekintés</span>
      </a>
      <span class="sidebar-group-label" data-label="nav.group.mine">Saját</span>
      <a class="sidebar-btn nav-primary" href="#/list" data-route="list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span>Könyvtár</span>
      </a>
      <a class="sidebar-btn nav-primary" href="#/notifications" data-route="notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span>Értesítések</span>
        <span class="notif-badge hidden" id="notif-badge"></span>
      </a>
      <span class="sidebar-group-label" data-label="nav.group.community">Közösség</span>
      <a class="sidebar-btn" href="#/community" data-route="community">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4c0-1.1.9-2 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/></svg>
        <span>Közösség</span>
      </a>
      <a class="sidebar-btn" href="#/w2g" data-route="w2g">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Közös nézés</span>
      </a>
      <div class="sidebar-spacer"></div>
      <a class="sidebar-btn hidden" href="#/admin" data-route="admin" id="nav-admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>
        <span>Admin</span>
      </a>
      <a class="sidebar-btn" href="#/settings" data-route="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Beállítások</span>
      </a>
      <button class="sidebar-btn sidebar-profile" id="profile-switcher" type="button" aria-haspopup="menu" aria-expanded="false">
        <span class="sidebar-avatar" id="sidebar-avatar"></span>
        <span class="sidebar-profile-label">Profil</span>
      </button>
      <!-- phone only: opens the "More" sheet -->
      <button class="sidebar-btn nav-more" id="nav-more" type="button" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        <span>Továbbiak</span>
      </button>
    </nav>
    <!-- ===== Main content =====
         tabindex="-1" so the skip link, and the router after every
         navigation, can move focus here rather than merely scroll to it. -->
    <main class="page" id="page" tabindex="-1"></main>
  </div>
  <!-- quick search (Ctrl+K, or S outside a text field) -->
  <div class="modal-backdrop search-backdrop hidden" id="search-modal">
    <div class="search-modal" role="dialog" aria-modal="true" aria-labelledby="search-modal-title">
      <h2 class="sr-only" id="search-modal-title">Gyorskeresés</h2>
      <div class="search-modal-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search-modal-input" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false"
               aria-controls="search-modal-results" aria-label="Anime keresése" placeholder="Anime keresése…"
               autocomplete="off" spellcheck="false" enterkeyhint="search">
        <kbd>Esc</kbd>
      </div>
      <div class="search-modal-results" id="search-modal-results" role="listbox" aria-label="Találatok"></div>
      <div class="search-modal-foot" aria-hidden="true">
        <span><kbd>↑</kbd><kbd>↓</kbd> lépkedés</span>
        <span><kbd>Enter</kbd> megnyitás</span>
        <span><kbd>Esc</kbd> bezárás</span>
      </div>
    </div>
  </div>
  <!-- Toasts are announced: a live region, polite, so a confirmation never
       interrupts what is being read. An error toast raises itself to alert. -->
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <!-- One module, and the browser resolves the rest.
       This was forty <script> tags in a load-bearing order, with every file
       hanging its object off `window` for the next one to find. There was no
       dependency direction at all: 51 reference cycles between the files, and
       nothing that could be checked, because a global is not an import.
       See apps/web/src/app/main.js. -->
  <script type="module" src="/src/app/main.js"></script>

</body>

</html>
