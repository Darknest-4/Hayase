# Yume — full stack via Docker.
# Usage: docker compose up            (starts the app + Postgres)
#        docker compose --profile infra up -d   (optional redis/opensearch/minio)
# The app container serves BOTH the API and the web client on http://localhost:4000
services:
  # the whole app (API + static web client) in one container
  app:
    build: .
    restart: unless-stopped
    # LEGKISEBB JOGOSULTSÁG.
    #
    # `no-new-privileges`: a konténerben futó folyamat nem szerezhet több jogot,
    # mint amennyivel indult — setuid binárison keresztül sem. A YUME egyik
    # szolgáltatásának sincs szüksége jogosultság-emelésre.
    #
    # `cap_drop: ALL`: a Docker alapból tizennégy képességet ad minden
    # konténernek (nyers socket, chown, mknod, …). Egy Node-folyamatnak, ami egy
    # magas portra köt és `node` felhasználóként fut, egyik sem kell.
    #
    # A folyamatkorlát a `deploy.resources.limits.pids` alatt ül, a memória
    # mellett: egy elszabadult folyamat ne tudja elfogyasztani a gazdagép
    # folyamattábláját. A mért csúcs 22 folyamat volt; a 256 bőséges tartalék.
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://yume:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/yume
      # Required. The app refuses to boot in production with a placeholder or a
      # secret under 32 chars. Put it in a .env file next to this compose file:
      #   JWT_SECRET=$(openssl rand -base64 48)
      JWT_SECRET: '${JWT_SECRET:?set JWT_SECRET in .env — generate one with `openssl rand -base64 48`}'
      PORT: '4000'
      HOST: 0.0.0.0
      # CORS is same-origin by default in production, which is what this
      # single-container deployment needs. Only set this if you host the web
      # client on a different origin, e.g. CORS_ORIGINS=https://app.example.com
      # CORS_ORIGINS: ''
      # Only the Docker network may set X-Forwarded-For. Never `true`: that
      # trusts the header from anyone and makes rate limiting bypassable, and
      # never a bare hop count — Fastify 5.12 reads that as "trust nobody",
      # which puts every client into one rate-limit bucket. Address or subnet.
      TRUST_PROXY: ${TRUST_PROXY:-172.16.0.0/12}
      # HONNAN JÖN A KATALÓGUS KÉPE.
      #
      # Üresen a saját `/media/` útvonalunk, ami külső beállítás nélkül
      # működik — a kép a tükörből jön, nem az idegen CDN-ről.
      #
      # `https://media.animehub.hu`-ra állítva a kép közvetlenül az R2-ből
      # megy a látogatóhoz, a hozzá legközelebbi Cloudflare él-szerverről,
      # NULLA kimenő díjjal, és a mi gépünket el sem éri. Ehhez a vödröt a
      # Cloudflare-en össze kell kötni a domainnel — lásd docs/operations/domain.md.
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-}
      # A karbantartási oldal háttérvideója. Ugyanaz a megfontolás, csak
      # élesebben: ez az oldal PONT AKKOR megy ki, amikor a kiszolgáló bajban
      # van — túlterhelés, telepítés, adatbázishiba —, és egy 35 MB-os videó
      # minden látogatónak, a saját sávszélességünkről, a lehető legrosszabb
      # pillanatban érkezne. Beállítva a fájl az R2-ből megy, a mi gépünk
      # terhelése nélkül.
      #
      # A KÖNYVTÁR MARAD A KATALÓGUS: a neveket továbbra is az
      # `assets/videos` adja, ez csak azt mondja meg, honnan tölti le a
      # böngésző ugyanazt a nevet. A vödörben tehát ugyanazon a néven kell
      # lennie — feltöltés: apps/api/scripts/upload-video.ts --key …
      MAINTENANCE_VIDEO_BASE: ${MAINTENANCE_VIDEO_BASE:-}
      # This site's public address. Used for the canonical link, the Open Graph
      # URL and the Sitemap: line in robots.txt. Leave it unset and those are
      # built from the Host header, which the caller chooses — see docs/seo.md.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # EMBERPRÓBA (Cloudflare Turnstile) a hitelesítési űrlapokon.
      #
      # Két kulcs. A HELYSZÍNÉ nyilvános — a widget HTML-jébe kerül, tehát
      # minden látogató böngészőjében ott van amúgy is. A TITOK sosem hagyja el
      # a kiszolgálót: ez érvényesíti a tokent a Cloudflare felé.
      #
      # Mindkettő hiányában a modul minden kérést átenged, és az idegen eredetű
      # widget-szkript a CSP-be sem kerül bele. A KIKAPCSOLÁS ezért egy sor
      # kivétele a .env-ből — ez az a fogantyú, amihez éjjel is hozzá lehet
      # nyúlni, ha valami elromlana.
      #
      # TURNSTILE_PROTECT: melyik űrlapot védje (register,login,forgot).
      #   Alapból register,login. A `forgot` azért nincs benne, mert a
      #   webkliensben nincs hozzá űrlap, ami tokent tudna szerezni — bevenni
      #   annyi lenne, mint csendben bezárni egy végpontot.
      # TURNSTILE_HOSTNAMES: mely gazdanevekről fogadunk el tokent, a
      #   PUBLIC_URL-én felül. A Cloudflare megmondja, melyik oldalon futott a
      #   widget; enélkül egy máshol szerzett token is jó lenne.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_PROTECT: ${TURNSTILE_PROTECT:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}
      # A képtükör tárhelye — KÜLÖN VÖDÖR a mentésekétől, mert ezt a
      # tartalmat egy nyilvános útvonal szolgálja ki, a mentéseket soha semmi.
      # Az `app` olvassa (kiszolgálás), a `worker` írja (tükrözés).
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_MEDIA_BUCKET: ${R2_MEDIA_BUCKET:-yume-media}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    # Not published: caddy is the only way in. Expose it again only if you are
    # running without the proxy and know the request is already on a trusted
    # network.
    expose: ['4000']
    volumes:
      # A VIDEÓK CSATOLVA, nem a képbe építve.
      #
      # Egy feltöltött epizód nem indokolhat képépítést és újratelepítést, és
      # egy 35 MB-os fájl minden rétegbe belekerülne. Csak olvasható: az
      # alkalmazásnak kiszolgálnia kell őket, nem írnia.
      - ./apps/web/assets/videos:/app/apps/web/assets/videos:ro
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 768M, pids: 256 }

  # Background worker — REQUIRED in production. It creates next month's
  # partitions and enforces retention (without it, inserts into the
  # time-partitioned tables start failing once existing partitions run out),
  # delivers webhooks, computes stats rollups and collects VPS metrics.
  worker:
    build: .
    restart: unless-stopped
    # Ugyanaz a szűkítés, mint az `app`-nál — lásd az ottani indoklást.
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://yume:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/yume
      # The worker reports the instance's security posture, which includes
      # whether this secret is a real one — so it needs the value, not just the
      # variable. The one-shot services below deliberately have no JWT_SECRET:
      # they never sign a token, and config only asks for one when something
      # reads it.
      JWT_SECRET: '${JWT_SECRET:?set JWT_SECRET in .env — generate one with `openssl rand -base64 48`}'
      # where the worker reaches the API to measure its response time
      SELF_URL: http://app:4000
      # Host filesystem for disk metrics. /proc is already the host's inside a
      # container, but statfs('/') would measure the container overlay — so the
      # host root is bind-mounted read-only, the same approach node-exporter uses.
      DISK_PATH: /host
      # A KÜLSŐ szonda címe. A worker innen kéri le a `/v1/health`-et, a
      # fordított proxyn keresztül — vagyis onnan nézve, ahonnan a látogató
      # látja. Üresen hagyva a `PUBLIC_URL`-re esik vissza; ha egyik sincs, a
      # szonda csendben kimarad ahelyett, hogy hibát jelentene.
      EDGE_PROBE_URL: ${EDGE_PROBE_URL:-https://yumee.duckdns.org}

      # A képtükör tárhelye — KÜLÖN VÖDÖR a mentésekétől, mert ezt a
      # tartalmat egy nyilvános útvonal szolgálja ki, a mentéseket soha semmi.
      # Az `app` olvassa (kiszolgálás), a `worker` írja (tükrözés).
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_MEDIA_BUCKET: ${R2_MEDIA_BUCKET:-yume-media}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      # MONITOR_INTERVAL_MS: '60000'      # collection cadence
      # METRICS_RETENTION_DAYS: '7'       # raw sample retention
    volumes:
      - /:/host:ro
    command: ['npm', 'run', 'worker']
    healthcheck:
      # The worker has no port, so liveness is "the process can still reach the
      # database" — which is what it needs in order to do anything at all.
      test: ['CMD', 'node', '--experimental-strip-types', '-e', "import('./src/infrastructure/database/index.ts').then(m=>m.query('SELECT 1')).then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 512M, pids: 256 }

  # one-shot catalogue seed (25k anime + episodes) into the persistent volume.
  # Run once: docker compose --profile seed run --rm --build seed
  # Downloads the official dump by default; never runs on normal `up`.
  seed:
    build: .
    profiles: ['seed']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://yume:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/yume
      # SEED_URL: <override the dump source, or mount a file and pass its path>
    command: ['sh', '-c', 'node --experimental-strip-types src/infrastructure/migrations/migrate.ts && node --experimental-strip-types scripts/seed.ts']

  # one-shot: give the founder's account the whole catalogue, already watched.
  #
  # The first account on an instance gets this automatically — registration
  # enqueues the job and the worker runs it. This is for an instance whose
  # account already existed before the feature did, which is every instance
  # upgrading rather than installing.
  #
  #   docker compose --profile founder run --rm --build founder -- --dry-run
  #   docker compose --profile founder run --rm --build founder
  #   docker compose --profile founder run --rm --build founder -- --username someone
  #   docker compose --profile founder run --rm --build founder -- --only-public
  #
  # --build, every time. A bare `docker compose build` builds the default
  # profile only, so these one-shot services keep whatever image they were last
  # run with — which is how a fixed bug came back on the next deploy, running
  # from an image built before the fix.
  #
  # Idempotent: running it twice writes nothing the second time.
  founder:
    build: .
    profiles: ['founder']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://yume:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/yume
    entrypoint: ['node', '--experimental-strip-types', 'scripts/seed-founder.ts']

  # one-shot: default forum boards, chat rooms and the development log.
  #
  # Idempotent and keyed on the slug or the version, so it is safe — and
  # intended — to run after every deploy: it adds what is new and never touches
  # what people have written or what an editor has changed by hand.
  #
  #   docker compose --profile community run --rm --build community
  #
  # --build for the same reason as the founder service above: a bare
  # `docker compose build` does not reach a profile.
  community:
    build: .
    profiles: ['community']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://yume:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/yume
    entrypoint: ['node', '--experimental-strip-types', 'scripts/seed-community.ts']

  # one-shot AniList enrichment: fills synopsis, cover/banner, score, genres,
  # tags, studios and trailer onto the seeded rows (matched by anilist_id).
  # Run after seed: docker compose --profile enrich run --rm --build enrich
  # Rate-limited by AniList — expect this to take a while for the full catalogue.
  enrich:
    build: .
    profiles: ['enrich']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://yume:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/yume
      # AL_DELAY_MS: '2000'   # pacing between AniList batches of 50
    command: ['npm', 'run', 'import:anilist']

  # HTTPS terminator. Obtains and renews a Let's Encrypt certificate for
  # YUME_DOMAIN automatically; without a domain set it serves plain HTTP on :80
  # so local `docker compose up` still works.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      YUME_DOMAIN: ${YUME_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./infrastructure/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:80/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3

  # Database backups. Runs pg_dump daily, then proves the dump by restoring it
  # into a scratch database — an unverified backup is a guess. Uses the same
  # Postgres image so pg_dump always matches the server version.
  #   docker compose run --rm backup db/backup.sh          take one now
  #   docker compose run --rm backup db/restore.sh --list  see what exists
  #   docker compose run --rm backup db/restore.sh         restore the newest
  backup:
    # Saját kép a hivatalos Postgres fölött: a `pg_dump` verziójának egyeznie
    # kell a kiszolgálóéval, az `alpine` viszont nem hoz magával semmit, amivel
    # a mentés elhagyhatná a gépet. Lásd infrastructure/backup/Dockerfile.
    build: infrastructure/backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://yume:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/yume
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_AT_HOUR: ${BACKUP_AT_HOUR:-3}
      # A mentés MÁSOLATA a gépen kívülre. Enélkül egy lemezhiba egyszerre
      # viszi az adatbázist és a mentését — az audit ezt nevezte meg a mentés
      # legnagyobb nyitott kockázataként.
      #
      # Alapból a mellékelt R2-szkript fut; a `BACKUP_SYNC_CMD` felülírható, ha
      # valaki máshová (rsync, S3, B2) másolna. A szkript magától kilép, ha az
      # R2-beállítások hiányoznak, és a hiányzó változót néven nevezi.
      #
      # A `$$1` nem elgépelés. A `backup.sh` a parancsot
      # `sh -c "$$BACKUP_SYNC_CMD" -- "$$DUMP"` alakban futtatja, tehát a dump
      # útvonala a PARANCSSZTRING `$$1`-e — a sztringnek magának kell
      # hivatkoznia rá, különben a meghívott program argumentum nélkül indul.
      # (A dupla dollár a compose behelyettesítése elől védi.)
      BACKUP_SYNC_CMD: ${BACKUP_SYNC_CMD:-/db/sync-r2.sh "$$1"}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PREFIX: ${R2_PREFIX:-yume}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    volumes:
      - ./scripts/database:/db:ro
      - backups:/backups
    working_dir: /
    command: ['/db/backup-cron.sh']

  postgres:
    image: postgres:16-alpine
    # `unless-stopped`, mint minden másnak. A hiánya nem elméleti hiba volt:
    # app, worker, caddy és backup mind újraindul magától, a Postgres viszont
    # nem — egy újraindítás vagy egy Docker-daemon-frissítés után a YUME
    # adatbázis nélkül jött volna vissza, a többi szolgáltatás pedig egy nem
    # létező kiszolgálóra indult volna újra körbe-körbe.
    restart: unless-stopped
    environment:
      POSTGRES_USER: yume
      # No default: a database password that falls back to a value published
      # in this file is not a password. Put it in .env next to JWT_SECRET.
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — generate one with `openssl rand -base64 32`}'
      POSTGRES_DB: yume
      # Pinned, not inherited. Without this the encoding depends on whichever
      # host ran initdb, and a database that comes up as SQL_ASCII cannot fold
      # accented letters — lower('Á') stays 'Á', so Hungarian search misses.
      # Encoding cannot be changed after initdb, only by dump and restore, so
      # it has to be right the first time. apps/api/src/infrastructure/migrations/db-encoding.ts
      # refuses to create a schema on a database that got this wrong.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    # NOT published to the host: every service reaches Postgres over the compose
    # network as `postgres:5432`. Publishing it would expose the database on the
    # VPS's public interface. For local psql access use:
    #   docker compose exec postgres psql -U yume yume
    expose: ['5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    # A PÁRHUZAMOS LEKÉRDEZÉSEK OSZTOTT MEMÓRIÁJA.
    #
    # A Docker alapértelmezett `/dev/shm`-je 64 MB. A `shared_buffers` nem
    # innen jön (azt a Postgres `mmap`-pel foglalja), de a párhuzamos
    # lekérdezések munkásai IGEN — és 64 MB-on egy nagyobb párhuzamos hash-join
    # „could not resize shared memory segment" hibával áll meg. Ez a fajta hiba
    # terhelés alatt jelentkezik először, vagyis a legrosszabbkor.
    shm_size: 1gb
    # A HANGOLÁS. Mérve, hangolás előtt (lásd docs/audits/):
    #
    #   shared_buffers        128 MB   miközben a teljes adatbázis 1 107 MB
    #   work_mem                4 MB   → 391 ideiglenes fájl, 2 531 MB lemezre ömlött
    #   effective_cache_size    4 GB   miközben a gazdagépen 6,7 GB a lapcache
    #   random_page_cost          4    ami forgó lemez feltételezése, nem SSD-é
    #
    # `shared_buffers = 2GB`: a teljes adatbázis elfér benne. A 98,14%-os
    # találati arányt eddig a gazdagép lapcache-e tartotta — most a Postgres
    # saját puffere teszi, ahol a találat olcsóbb.
    #
    # `work_mem = 16MB`: ez a KOCKÁZATOS érték, mert MŰVELETENKÉNT és
    # KAPCSOLATONKÉNT él. A felső korlát kiszámítható: az app és a worker
    # készlete 20-20 kapcsolat, tehát 40 × 16 MB × néhány rendezés ≈ 1,3 GB
    # csúcs. A 9,7 GB-os gépen, 2 GB `shared_buffers` mellett ez belefér, és a
    # most beállított 2 GB swap a párna alatta.
    #
    # `autovacuum_work_mem = 256MB` külön, mert a `maintenance_work_mem`-et
    # három autovacuum-munkás EGYSZERRE használhatná — 3 × 512 MB már nem
    # elhanyagolható. A kézi `VACUUM` és az indexépítés kapja a teljeset.
    #
    # A `random_page_cost` SZÁNDÉKOSAN MARAD AZ ALAPÉRTELMEZETT 4-EN.
    #
    # A kézikönyvi tanács SSD-re 1,1, és be is állítottam — aztán megmértem.
    # Tizenöt-tizenöt mintán, a két érték között váltogatva, hogy a bemelegedés
    # egyiknek se kedvezzen:
    #
    #   random_page_cost = 1.1   medián 109,2 ms   átlag 150,5 ms
    #   random_page_cost = 4     medián  68,9 ms   átlag 112,8 ms
    #
    # A YUME keresése GIN trigram-indexeken fut, és a bitmap-olvasás után sok
    # jelöltet dob el a visszaellenőrzés (`kimetsu`: 1 531 jelöltből 1 502).
    # Az alacsony érték túlságosan indexpártivá teszi a tervezőt, és pont a
    # legdrágább lekérdezésünket lassítja. A lemez ugyan SSD, de a döntés nem
    # a lemezről szól, hanem arról, hogy MENNYIT dolgozunk fölöslegesen.
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=16MB
      -c maintenance_work_mem=512MB
      -c autovacuum_work_mem=256MB
    deploy:
      resources:
        # Nem fojtás, hanem korlát: egy elszabadult lekérdezéssor ne vigye el a
        # gazdagépet a másik projekt és a Caddy elől. 2 GB a puffer, a többi a
        # kapcsolatonkénti munkamemóriának és a folyamatoknak.
        limits: { memory: 4G }
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yume']
      interval: 5s

  # Redis is the one optional service still here, because it has a job waiting
  # for it: sharing the WebSocket hub and the permission cache once a second
  # app instance exists. Off by default until that day — see docs/redis.md.
  # OpenSearch, MinIO and RabbitMQ were removed: search runs on Postgres,
  # and the job queue on Postgres.
  redis:
    image: redis:7-alpine
    profiles: ['infra']
    command: redis-server --appendonly yes
    # Loopbackra kötve, nem minden interfészre. A szolgáltatás profil mögött
    # alszik, de a definíció egy `--profile infra up`-nyira van attól, hogy egy
    # jelszó nélküli Redis a nyílt interneten hallgasson. Az alkalmazás a
    # compose-hálózaton belülről éri el `redis:6379`-ként; a publikálás csak
    # annak kell, aki a gépről nézegeti.
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redisdata:/data']



volumes:
  pgdata:
  backups:
  caddydata:
  caddyconfig:
  redisdata:
